name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mobile ZIP if present
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
          if [ -d "SignalNamaWidget-Android" ] && [ ! -f "SignalNamaWidget-Android/gradle.properties" ]; then
            printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n" > SignalNamaWidget-Android/gradle.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          if [ -d "SignalNamaWidget-Android" ]; then
            cd SignalNamaWidget-Android
          fi
          gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalNamaWidget-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
